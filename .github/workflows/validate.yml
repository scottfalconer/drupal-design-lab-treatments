name: Validate treatments

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python packs/tools/check.py
      - run: python packs/tools/check.py templates/my_treatment.yml
      - run: python tools/build_catalog.py --check
      - run: python -m unittest discover -s tests
